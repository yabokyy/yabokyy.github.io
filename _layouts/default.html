<!doctype html>
<html lang="{{ site.lang | default: 'ru' | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Перейти к содержимому</a>
    <header class="site-header container">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} — главная">{{ site.title | escape }}<span aria-hidden="true"> /</span></a>
      <nav aria-label="Основная навигация">
        <a href="{{ '/' | relative_url }}#projects">Проекты</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>Обо мне</a>
      </nav>
    </header>
    <main id="main" class="container" tabindex="-1">{{ content }}</main>
    <footer class="site-footer container">
      <span>© {{ 'now' | date: '%Y' }} {{ site.author | escape }}</span>
      <span>Сделано без удовольствия <span class="accent" aria-hidden="true">✦</span></span>
      <a href="https://github.com/{{ site.github_username | escape }}">GitHub ↗</a>
    </footer>
  </body>
</html>
